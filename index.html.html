<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The Great Botley Road Closure Quiz</title><style>
:root{--bg:#f6f0e4;--card:#fffdf8;--ink:#222;--muted:#6b6257;--accent:#8b5e3c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.45}.wrap{max-width:820px;margin:0 auto;padding:28px 16px 60px}header,.q,#result{background:var(--card);border:1px solid #e8dcc8;border-radius:18px;box-shadow:0 6px 24px rgba(0,0,0,.06)}header{padding:28px 24px;margin-bottom:18px}h1{margin:0 0 8px;font-size:clamp(2rem,6vw,3.2rem);line-height:1.05}header p{margin:0;color:var(--muted);font-size:1.05rem}.q{padding:20px;margin:14px 0}.q h2{font-size:1.05rem;margin:0 0 14px}.num{color:var(--accent);font-weight:800}label{display:block;border:1px solid #d9cdbc;border-radius:12px;padding:12px 14px;margin:9px 0;cursor:pointer;background:#fff}label:hover{border-color:var(--accent);background:#fffaf2}input{margin-right:10px}button{border:0;border-radius:12px;padding:14px 20px;background:var(--accent);color:#fff;font-size:1rem;font-weight:700;cursor:pointer}#result{display:none;padding:24px;margin-top:18px}.score{font-size:2rem;font-weight:800}.miss{margin:10px 0;padding:10px 12px;border-left:4px solid #d6c8b6;background:#fff}.restart{margin-top:12px;background:#6d685f}
</style></head><body><div class="wrap"><header><h1>The Great Botley Road Closure Quiz</h1><p>10 questions about Oxford's epic road closure — plus a few historically accurate red herrings.</p></header><form id="quiz"></form><button id="submit" type="button">Mark my quiz</button><div id="result"></div></div><script>
const questions=[
{q:"On what date did Botley Road actually close to through traffic at the railway bridge?",o:["9 January 2023","11 April 2023","18 June 1815, the day of Waterloo","14 October 1066, the day of Hastings"],a:1,e:["9 January was an earlier proposed start date, but it did not happen.","Botley Road closed to through motor traffic on 11 April 2023.","18 June 1815 was the date of Waterloo, but not the Botley Road closure.","14 October 1066 was the Battle of Hastings, long before the railway existed."]},
{q:"Who was UK Prime Minister when Botley Road closed on 11 April 2023?",o:["Liz Truss","Robert Walpole","Rishi Sunak","William Gladstone"],a:2,e:["Liz Truss's premiership ended in October 2022, before the closure.","Robert Walpole was Britain's first Prime Minister in the 18th century.","Rishi Sunak was Prime Minister from 25 October 2022 to 5 July 2024.","William Gladstone was a 19th-century Prime Minister, serving four times."]},
{q:"What was the main reason for closing Botley Road at the railway bridge?",o:["Routine resurfacing of Botley Road","Building the Oxford branch of the Great Pyramid","Oxford Station and railway redevelopment","Preparing a route for Roman chariots"],a:2,e:["The work was much larger than routine resurfacing.","Oxford has no Great Pyramid project associated with Botley Road.","The closure enabled major Oxford Station, railway bridge, utilities and highway works.","Roman chariots were not being prepared for a 2023 diversion route."]},
{q:"What happened to buses approaching the closed railway bridge during the initial closure?",o:["They continued underneath as normal","Passengers transferred to sedan chairs","They turned around before the bridge","They were replaced by horse-drawn omnibuses"],a:2,e:["Motor vehicles, including buses, could not pass beneath the bridge during the closure.","Sedan chairs are historical transport, not part of the 2023 arrangement.","Buses could serve the Botley Road side but had to turn around before the bridge.","Horse-drawn omnibuses are historical, but buses remained buses in 2023."]},
{q:"Which unexpected structure discovered beneath Botley Road contributed to delays in 2023?",o:["A modern concrete storm drain","An inverted brick arch","A medieval drawbridge","Hadrian's Wall"],a:1,e:["The reported surprise was an older brick structure, not simply a modern concrete drain.","Workers discovered an inverted brick arch associated with the Victorian drainage system.","A medieval drawbridge was not the structure discovered under Botley Road.","Hadrian's Wall is in northern England, not beneath Botley Road in Oxford."]},
{q:"What other rather alarming historical object was unearthed at the Botley Road work site in summer 2023?",o:["A Victorian railway signal","A cannonball from the English Civil War","A Viking sword","A Second World War-era hand grenade"],a:3,e:["The reported object that caused an evacuation was a WWII-era hand grenade, not a railway signal.","Oxford has strong English Civil War connections, but this was not the object found.","Viking swords are genuine artefacts, but this was a much more recent military object.","A WWII-era hand grenade was found and led to an evacuation while it was dealt with."]},
{q:"A month after Botley Road closed, which major national event took place on 6 May 2023?",o:["The coronation of King Charles III","The coronation of Queen Victoria","The Eurovision Song Contest final in Liverpool","The coronation of William the Conqueror"],a:0,e:["King Charles III and Queen Camilla were crowned at Westminster Abbey on 6 May 2023.","Queen Victoria's coronation was in 1838.","The Eurovision 2023 Grand Final in Liverpool was on 13 May.","William the Conqueror was crowned on Christmas Day 1066."]},
{q:"What happened to pedestrian and cycle access beneath the railway during the initial Botley Road closure?",o:["It was completely closed with the road","A Victorian penny-farthing lane was opened","A punt service carried everyone along the Thames","Access was maintained through a walkway"],a:3,e:["The closure did not eliminate pedestrian and cycle passage.","Penny-farthings are Victorian bicycles, but no special penny-farthing lane was created.","Punting is an Oxford tradition, but not the official Botley Road crossing arrangement.","Pedestrians and cyclists could still pass through the work area via a maintained route, with cyclists initially required to dismount in the tunnel."]},
{q:"At Easter 2023, Botley Road users had an extra transport headache: what happened on the railway south of Oxford?",o:["Nuneham Viaduct was closed after engineers detected movement","Oxford station permanently lost its London services","Stephenson's Rocket arrived to take over services","Brunel personally arrived to inspect the line"],a:0,e:["Engineers detected significant movement at Nuneham Viaduct, disrupting the railway south of Oxford.","London services were disrupted, but they were not permanently abolished.","Stephenson's Rocket dates from 1829 and did not take over Oxford services in 2023.","Isambard Kingdom Brunel died in 1859, so his personal inspection was impossible."]},
{q:"When Botley Road first closed, how long was that initial April-to-October 2023 closure expected to last?",o:["About twelve months","About seven months","The Hundred Years' War","The entire reign of Queen Victoria"],a:1,e:["An earlier plan had involved a longer closure, but the revised timetable separated the work into periods.","The initial planned closure ran from 11 April to the end of October 2023, roughly seven months.","The Hundred Years' War lasted from 1337 to 1453, far longer than the planned closure.","Queen Victoria reigned from 1837 to 1901, far longer than the planned Botley Road closure."]}
];
function render(){document.getElementById('quiz').innerHTML=questions.map((x,i)=>`<section class="q"><h2><span class="num">${i+1}.</span> ${x.q}</h2>${x.o.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}</section>`).join('')}
function mark(){let score=0,miss=[];questions.forEach((x,i)=>{let s=document.querySelector(`input[name=q${i}]:checked`);if(s&&+s.value===x.a)score++;else miss.push([i,x])});let r=document.getElementById('result');let h=`<div class="score">You scored ${score}/10</div><p>${score===10?'Botley Road legend.':score>=7?'A very respectable knowledge of Oxford road drama.':score>=4?'You survived the closure, if not the whole quiz.':'You may have taken the scenic route through history.'}</p>`;if(miss.length)h+='<h3>Quick review</h3>'+miss.map(([i,x])=>`<div class="miss"><strong>${i+1}. ${x.o[x.a]}</strong><br>${x.e[x.a]}</div>`).join('');h+='<button class="restart" type="button" onclick="render();document.getElementById(\'result\').style.display=\'none\';window.scrollTo(0,0)">Try again</button>';r.innerHTML=h;r.style.display='block';r.scrollIntoView({behavior:'smooth'})}
render();document.getElementById('submit').onclick=mark;
</script></body></html>
